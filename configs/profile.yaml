# 固定入口：python -m offline.profile；相对路径以 satllm_simulator 为基准。
models:
  Qwen2.5-7B-Instruct: /mnt/data/zdg/models/Qwen2.5-7B-Instruct

dataset: datasets/ShareGPT/ShareGPT_V3_unfiltered_cleaned_split.json
sample_requests: 128
max_input_tokens: 2048
prefill_chunk_sizes: [64, 128, 256, 512]
decode_batch_sizes: [1, 32, 64, 128]
decode_context_lengths: [128, 512, 1024, 2048]
decode_steps: 64
# 仅用于构建 Decode 初始 KV，不作为 Decode 测量记录。
decode_prefill_chunk_size: 512

device: cuda:0
dtype: bfloat16
warmup: 5
repeats: 30
# NVML 对固定 case 做独立稳态重复测量，单位秒；不是逐 token 瞬时功率。
power_settle_s: 1.0
power_measure_s: 1.0
power_sample_interval_s: 0.02
output_dir: data/profiles
